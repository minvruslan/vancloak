- name: Assert required variables are provided
  ansible.builtin.assert:
    that:
      - hardening_ssh_port is defined
    fail_msg: >-
      Missing required variables. They are injected automatically by
      RemoteServer.hardenSsh (@vancloak/infrastructure);
      for manual runs pass them via --extra-vars.

- name: Assert the node OS family is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      SSH hardening supports Debian-family nodes only;
      got "{{ ansible_facts['os_family'] | default('unknown') }}".

- name: Check whether the ssh systemd socket unit exists
  ansible.builtin.command:
    cmd: systemctl list-unit-files ssh.socket
  register: hardening_ssh_socket_lookup
  changed_when: false
  failed_when: false

- name: Replace ssh socket activation with the ssh service
  ansible.builtin.shell:
    cmd: >-
      systemctl daemon-reload &&
      systemctl disable --now ssh.socket &&
      systemctl mask ssh.socket &&
      systemctl daemon-reload &&
      systemctl enable ssh.service &&
      systemctl start ssh.service
  when: "'ssh.socket' in hardening_ssh_socket_lookup.stdout and 'masked' not in hardening_ssh_socket_lookup.stdout"

- name: Harden the SSH daemon
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
  vars:
    ssh_server_ports: ["{{ hardening_ssh_port }}"]
    ssh_permit_root_login: "no"
    ssh_server_password_login: false
    ssh_use_pam: true
    sftp_enabled: true
